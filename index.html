<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>책갈피 · 나의 독서 기록</title><style>
:root{--bg:#f7f6f2;--ink:#243a32;--muted:#65736b;--green:#285744;--line:#e1e5dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Apple SD Gothic Neo',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #c29a50;outline-offset:3px}.wrap{max-width:1000px;margin:auto;padding:30px 24px 100px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:23px;font-weight:800}.brand small{display:block;font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:4px}.tools{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:12px;padding:12px 18px;background:white;color:var(--ink);font-weight:650;min-height:44px}.primary{background:var(--green);color:white;border-color:var(--green)}.danger{color:#934c40}.hero{padding:40px 0 26px}.eyebrow{color:var(--muted);font-size:13px}h1{font-size:clamp(26px,5vw,38px);letter-spacing:-1px;margin:10px 0}p{line-height:1.65}.sub{color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}.stat{padding:22px;background:white;border:1px solid var(--line);border-radius:16px}.stat strong{display:block;font-size:30px;margin-top:8px}.stat span{font-size:13px;color:var(--muted)}.searchbox{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:32px}h2{font-size:19px;margin:0 0 16px}.searchform{display:flex;gap:8px}input{min-width:0;width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--ink);background:#fafbf8}.searchform .btn{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:22px 18px}.book{background:transparent;border:0;text-align:left;padding:0;color:var(--ink);width:100%}.cover{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:#e9ece2;border-radius:6px 12px 12px 6px;overflow:hidden;box-shadow:3px 7px 14px #243a3212;margin-bottom:12px;position:relative}.cover img{height:100%;width:100%;object-fit:cover}.fallback{padding:18px;text-align:center;font-size:16px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}.book b{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}.book small{color:var(--muted);font-size:12px;display:block;margin-top:5px;line-height:1.5}.book:hover .cover{transform:translateY(-3px)}section.shelf{margin:34px 0}.shelf h2{display:flex;align-items:center;gap:10px}.count{font-size:12px;background:#e6ebe2;padding:4px 9px;border-radius:20px}.empty{border:1px dashed #ccd5c8;border-radius:16px;padding:28px;color:var(--muted);text-align:center;font-size:14px}.foot{color:var(--muted);font-size:12px;margin-top:40px}.notice{font-size:13px;color:var(--muted);margin:12px 0 0}.error{color:#994532}dialog{border:1px solid var(--line);border-radius:22px;padding:26px;width:min(94vw,490px);max-height:90dvh;color:var(--ink);background:#fcfcf9}dialog::backdrop{background:#172d2466;backdrop-filter:blur(3px)}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{border:0;background:#edf0e9;border-radius:50%;width:40px;height:40px;font-size:22px}.detail{display:grid;grid-template-columns:110px 1fr;gap:20px;margin:20px 0}.detail .cover{margin:0}.detail h3{margin:0 0 10px;font-size:20px}.meta{font-size:13px;color:var(--muted);line-height:1.9}.actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}label{display:block;font-size:14px;margin:15px 0 8px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 22px;border-radius:14px;z-index:10;max-width:90vw;font-size:14px}a{color:var(--green)}@media(max-width:600px){.wrap{padding:22px 18px 70px}.hero{padding-top:32px}.stats{gap:8px}.stat{padding:14px 10px}.stat span{font-size:11px}.stat strong{font-size:25px}.tools .btn{padding:10px;font-size:12px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}.searchbox{padding:17px}.book b{font-size:12px}.fallback{font-size:13px;padding:10px}.detail{grid-template-columns:95px 1fr}.brand{font-size:21px}}
</style></head><body><main class="wrap"><header><div class="brand">▤ 책갈피<small>MY READING JOURNAL</small></div><div class="tools"><button class="btn" id="backup">백업</button><button class="btn" id="restore">복원</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></header><div class="hero"><div class="eyebrow" id="today"></div><h1>한 권씩, 나만의 속도로.</h1><p class="sub">읽는 순간부터 마지막 페이지까지, 당신의 책장을 기록하세요.</p></div><div class="stats" id="stats"></div><section class="searchbox"><h2>다음 책을 찾아볼까요?</h2><form class="searchform" id="searchForm"><input id="query" placeholder="책 제목, 저자 또는 ISBN 검색" aria-label="책 검색" required maxlength="200"><button class="btn primary" id="searchButton">검색</button></form><p class="notice">Open Library 도서 검색 · 한국어 도서는 검색 결과가 제한적일 수 있어요.</p><p id="searchStatus" class="notice" role="status" aria-live="polite"></p><div id="results" class="grid" style="margin-top:20px"></div><button id="more" class="btn" hidden style="margin-top:20px">더 보기</button></section><div id="shelves"></div><footer class="foot">기록은 이 브라우저에만 저장됩니다. 기기 간 동기화는 지원하지 않으며, 브라우저 데이터 삭제 전에 백업해 주세요.<br>도서 정보 및 표지: <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a></footer></main><dialog id="modal"><div class="dialoghead"><b id="modalTitle">책 정보</b><button class="close" id="close" aria-label="닫기">×</button></div><div id="modalBody"></div></dialog><div id="toast" class="toast" role="status" hidden></div><script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const USER='local-user',KEY='bookmark.records.v1';
// Replace this repository with a user-scoped server repository to add accounts/sync.
const repository={load(){const raw=localStorage.getItem(KEY);if(!raw)return [];const data=JSON.parse(raw);if(!Array.isArray(data)||!data.every(validRecord))throw Error('저장된 기록 형식을 확인할 수 없습니다.');return data},save(rows){localStorage.setItem(KEY,JSON.stringify(rows))}};
function validRecord(r){return r&&typeof r.id==='string'&&typeof r.userId==='string'&&r.book&&typeof r.book.key==='string'&&typeof r.book.title==='string'&&typeof r.book.author==='string'&&['reading','finished','stopped'].includes(r.status)&&Number.isFinite(Date.parse(r.startedAt))&&(r.status==='reading'?r.endedAt===null:Number.isFinite(Date.parse(r.endedAt))&&Date.parse(r.endedAt)>=Date.parse(r.startedAt))&&(!r.book.cover||/^https:\/\/covers\.openlibrary\.org\//.test(r.book.cover))}
const bookProvider={async search(query,page,signal){const p=new URLSearchParams({q:query,page:String(page),limit:'18',fields:'key,title,author_name,first_publish_year,cover_i,isbn',lang:'ko'});const res=await fetch('https://openlibrary.org/search.json?'+p,{signal});if(!res.ok)throw Error('도서 검색 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.');const data=await res.json();return {total:data.numFound??data.num_found??0,books:(data.docs||[]).map(b=>({key:b.key,title:b.title||'제목 없음',author:(b.author_name||[]).join(', ')||'저자 정보 없음',year:b.first_publish_year||null,isbn:b.isbn?.[0]||'',cover:b.cover_i?'https://covers.openlibrary.org/b/id/'+b.cover_i+'-M.jpg?default=false':''}))}}};
let records=[],blocked=false;try{records=repository.load()}catch(e){blocked=true;setTimeout(()=>toast('기록을 불러오지 못했습니다. 복원 전까지 저장을 중지합니다.'),100)}
let searchBooks=[],page=1,total=0,currentQuery='',controller=null,active=null,toastTimer;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
function commit(next){if(blocked){toast('저장소를 사용할 수 없습니다. 백업 파일을 복원해 주세요.');return false}try{repository.save(next);records=next;render();return true}catch(e){toast('저장하지 못했습니다. 브라우저 저장 권한과 용량을 확인해 주세요.');return false}}
function cover(book){return '<div class="cover">'+(book.cover?'<img loading="lazy" src="'+esc(book.cover)+'" alt="'+esc(book.title)+' 표지">':'<span class="fallback">'+esc(book.title)+'</span>')+'</div>'}
function wireImages(root){root.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{const span=document.createElement('span');span.className='fallback';span.textContent=img.alt.replace(/ 표지$/,'');img.replaceWith(span)},{once:true}))}
function fmt(v){return new Date(v).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function localNow(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function render(){const mine=records.filter(r=>r.userId===USER),defs=[['reading','독서 중','시작'],['finished','완독한 책','완독'],['stopped','중단한 책','중단']];const year=new Date().getFullYear();$('stats').innerHTML=[['독서 중',mine.filter(r=>r.status==='reading').length],['완독',mine.filter(r=>r.status==='finished').length],['중단',mine.filter(r=>r.status==='stopped').length],['올해 완독',mine.filter(r=>r.status==='finished'&&new Date(r.endedAt).getFullYear()===year).length]].map(([label,n])=>'<div class="stat"><span>'+label+'</span><strong>'+n+'<span> 권</span></strong></div>').join('');$('shelves').innerHTML=defs.map(([status,label,dateLabel])=>{const rows=mine.filter(r=>r.status===status).sort((a,b)=>Date.parse(b.endedAt||b.startedAt)-Date.parse(a.endedAt||a.startedAt));return '<section class="shelf"><h2>'+label+'<span class="count">'+rows.length+'</span></h2>'+(rows.length?'<div class="grid">'+rows.map(r=>'<button class="book" data-record="'+esc(r.id)+'">'+cover(r.book)+'<b>'+esc(r.book.title)+'</b><small>'+esc(r.book.author)+'</small><small>'+dateLabel+' '+esc(fmt(r.endedAt||r.startedAt))+'</small></button>').join('')+'</div>':'<div class="empty">'+(status==='reading'?'검색한 책에서 “독서 시작”을 눌러 첫 기록을 남겨보세요.':status==='finished'?'마지막 페이지까지 읽은 책이 여기에 모여요.':'잠시 내려놓은 책도 소중한 기록이에요.')+'</div>')+'</section>'}).join('');wireImages($('shelves'));$('shelves').querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>openBook(records.find(r=>r.id===b.dataset.record).book,records.find(r=>r.id===b.dataset.record)))}
async function search(append=false){if(controller)controller.abort();controller=new AbortController();const own=controller;const requestedPage=append?page+1:1;const q=append?currentQuery:$('query').value.trim();if(!q)return;currentQuery=q;if(!append){searchBooks=[];$('results').innerHTML='';page=0}$('searchButton').disabled=true;$('more').hidden=true;$('searchStatus').className='notice';$('searchStatus').textContent='책을 찾고 있어요…';const timeout=setTimeout(()=>own.abort(),20000);try{const result=await bookProvider.search(q,requestedPage,own.signal);if(controller!==own)return;page=requestedPage;total=result.total;searchBooks=append?[...searchBooks,...result.books]:result.books;$('results').innerHTML=searchBooks.map((b,i)=>'<button class="book" data-index="'+i+'">'+cover(b)+'<b>'+esc(b.title)+'</b><small>'+esc(b.author)+'</small></button>').join('');wireImages($('results'));$('results').querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>openBook(searchBooks[Number(b.dataset.index)]));$('searchStatus').textContent=total?'검색 결과 '+total.toLocaleString()+'건 · '+searchBooks.length+'권 표시':'검색 결과가 없어요. 다른 제목이나 저자, ISBN으로 검색해 보세요.';$('more').hidden=searchBooks.length>=total||!result.books.length}catch(e){if(controller!==own)return;$('searchStatus').className='notice error';$('searchStatus').textContent=e.name==='AbortError'?'검색 시간이 초과되었습니다. 인터넷 연결을 확인하고 다시 검색해 주세요.':e.message;if(append)$('more').hidden=false}finally{clearTimeout(timeout);if(controller===own)$('searchButton').disabled=false}}
function openBook(book,record=null){active={book,record};$('modalTitle').textContent='책 정보';$('modalBody').innerHTML='<div class="detail">'+cover(book)+'<div><h3>'+esc(book.title)+'</h3><div class="meta">'+esc(book.author)+'<br>최초 출간: '+esc(book.year||'정보 없음')+'<br>ISBN: '+esc(book.isbn||'정보 없음')+'</div></div></div>'+(record?'<p class="meta">시작: '+esc(fmt(record.startedAt))+(record.endedAt?'<br>'+ (record.status==='finished'?'완독':'중단')+': '+esc(fmt(record.endedAt)):'')+'</p>':'')+'<div class="actions">'+(record?.status==='reading'?'<button class="btn primary" id="finish">다 읽었어요</button><button class="btn danger" id="stop">그만 읽을래요</button>':'<button class="btn primary" id="start">'+(record?'다시 독서 시작':'독서 시작')+'</button>')+'</div>';wireImages($('modalBody'));if($('start'))$('start').onclick=()=>dateForm('reading');if($('finish'))$('finish').onclick=()=>dateForm('finished');if($('stop'))$('stop').onclick=()=>dateForm('stopped');if(!$('modal').open)$('modal').showModal()}
function dateForm(status){const labels={reading:'독서 시작',finished:'다 읽었어요',stopped:'그만 읽을래요'};$('modalTitle').textContent=labels[status];$('modalBody').innerHTML='<h3>'+esc(active.book.title)+'</h3><p class="sub">'+(status==='reading'?'책을 읽기 시작한':'책 읽기를 마친')+' 날짜와 시간을 선택하세요.</p><form id="dateForm"><label for="when">'+(status==='reading'?'시작':'종료')+' 일시</label><input type="datetime-local" id="when" required value="'+localNow()+'"><p id="dateError" class="notice error" role="alert"></p><div class="actions"><button class="btn primary">'+labels[status]+' 저장</button><button class="btn" type="button" id="back">이전</button></div></form>';$('back').onclick=()=>openBook(active.book,active.record);$('dateForm').onsubmit=e=>{e.preventDefault();const time=new Date($('when').value);if(!Number.isFinite(time.getTime()))return;if(time.getTime()>Date.now()+60000){$('dateError').textContent='미래 일시는 기록할 수 없어요.';return}let next;if(status==='reading'){if(records.some(r=>r.userId===USER&&r.book.key===active.book.key&&r.status==='reading')){$('dateError').textContent='이미 읽고 있는 책이에요. 홈 화면에서 기록을 확인하세요.';return}next=[...records,{id:globalThis.crypto?.randomUUID?.()||'r-'+Date.now()+'-'+Math.random().toString(36).slice(2),userId:USER,book:active.book,status,startedAt:time.toISOString(),endedAt:null}]}else{if(time.getTime()<Date.parse(active.record.startedAt)){$('dateError').textContent='종료 일시는 시작 일시보다 빠를 수 없어요.';return}next=records.map(r=>r.id===active.record.id?{...r,status,endedAt:time.toISOString()}:r)}if(commit(next)){$('modal').close();toast('독서 기록을 저장했어요.')}}}
$('searchForm').onsubmit=e=>{e.preventDefault();search()};$('more').onclick=()=>search(true);$('close').onclick=()=>$('modal').close();$('backup').onclick=()=>{if(blocked){toast('기록을 읽을 수 없어 백업할 수 없습니다.');return}const blob=new Blob([JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='책갈피-백업-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('restore').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error('백업 파일은 10MB 이하여야 합니다.');const data=JSON.parse(await file.text());if(data.schemaVersion!==1||!Array.isArray(data.records)||!data.records.every(validRecord)||new Set(data.records.map(r=>r.id)).size!==data.records.length)throw Error('올바른 책갈피 백업 파일이 아닙니다.');if(!confirm('현재 기록을 백업 파일의 '+data.records.length+'개 기록으로 교체할까요? 기존 기록을 먼저 백업하는 것을 권장합니다.'))return;const restored=data.records.map(r=>({...r,userId:USER}));repository.save(restored);blocked=false;records=restored;render();toast('백업을 복원했어요.')}catch(err){toast('복원 실패: '+err.message)}finally{e.target.value=''}};$('today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+' · 나의 작은 책장';render();
</script></body></html>
